<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nates Gym app icon: dumbbell on the accent blue, bar in the warm accent. -->
  <rect width="64" height="64" rx="14" fill="#2a78d6"/>
  <g stroke-linecap="round">
    <!-- bar -->
    <rect x="20" y="29" width="24" height="6" rx="3" fill="#fb923c"/>
    <!-- inner plates -->
    <rect x="14" y="18" width="7" height="28" rx="3.5" fill="#ffffff"/>
    <rect x="43" y="18" width="7" height="28" rx="3.5" fill="#ffffff"/>
    <!-- outer plates -->
    <rect x="6" y="23" width="6" height="18" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="52" y="23" width="6" height="18" rx="3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
